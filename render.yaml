databases:
  - name: usman-ai-gtm-db
    databaseName: usman_ai_gtm
    user: usman
    plan: free
    region: oregon

services:
  - type: web
    name: usman-ai-gtm-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PYTHONPATH
        value: .
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://lead-scraper-mxs5.vercel.app,http://localhost:3000"
      - key: DATABASE_URL
        fromDatabase:
          name: usman-ai-gtm-db
          property: connectionString
