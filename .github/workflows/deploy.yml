name: USMAN AI GTM - Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. QUALITY ASSURANCE & TEST SUITE
  # ============================================================================
  backend-qa:
    name: Backend Test Suite & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Validate Backend API & Models
        run: |
          python -c "from backend.app.main import app; print('Backend FastAPI successfully loaded:', app.title)"
          python -c "from backend.app.core.database import init_db; init_db(); print('Database models initialized successfully')"

  frontend-qa:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.usmanai.com/api' }}
        run: npm run build

  # ============================================================================
  # 2. AUTOMATIC PRODUCTION DEPLOYMENT
  # ============================================================================
  deploy-backend:
    name: Deploy FastAPI Backend (Render / Fly.io / Railway / Docker)
    needs: [backend-qa, frontend-qa]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Deploy to Cloud Python Host (Render Deploy Hook)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering automated backend deployment via webhook..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Backend deploy signal sent successfully."

  deploy-frontend:
    name: Deploy Next.js Web Application (Vercel / Cloudflare / Node Host)
    needs: [backend-qa, frontend-qa]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Deploy to Vercel (if configured)
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
